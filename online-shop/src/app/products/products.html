<section class="products-section" id="products">
  <h2>Наші товари</h2>

  @if (message) {
    <div class="message">
      {{ message }}
    </div>
  }

  <div class="products">
    @for (product of products; track product.name) {
      <app-product-card
        [name]="product.name"
        [price]="product.price"
        [description]="product.description"
        (buy)="onProductBuy($event)">
      </app-product-card>
    }
  </div>
</section>
